<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signature Drawing Studio — Abrar</title>
  <style>
    :root {
      --bg: #0c0d0e;
      --card: #141618;
      --border: #24272a;
      --accent: #C0FE04;
      --text: #ffffff;
      --text-muted: #8e949a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      letter-spacing: -0.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }
    .studio-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 740px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .canvas-wrapper {
      position: relative;
      background: #08090a;
      border: 2px dashed #2b3036;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 320 / 154;
      width: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .canvas-wrapper.active {
      border-color: var(--accent);
    }
    .guide-box {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #242a30;
      font-size: 13px;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      background: #1e2226;
      border: 1px solid #31373e;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    button:hover {
      background: #282d33;
      border-color: #424a52;
    }
    button.primary {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }
    button.primary:hover {
      background: #d4ff33;
      box-shadow: 0 0 16px rgba(192, 254, 4, 0.4);
    }
    .output-card {
      background: #08090a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .output-card header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
      text-align: left;
    }
    .output-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    textarea {
      background: #0e1012;
      border: 1px solid #1f2328;
      border-radius: 6px;
      color: var(--accent);
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      padding: 12px;
      resize: vertical;
      min-height: 90px;
      width: 100%;
    }
    .preview-section {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .preview-header {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .preview-box {
      background: #08090a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      position: relative;
    }
    .preview-svg {
      width: 100%;
      max-width: 320px;
      height: auto;
    }
    @keyframes svgDraw {
      to { stroke-dashoffset: 0; }
    }
    .is-playing path {
      animation: svgDraw var(--dur, 1.2s) cubic-bezier(0.65, 0, 0.35, 1) var(--delay, 0s) forwards;
    }
    .status-msg {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <header>
    <h1>✍️ Draw Your Signature</h1>
    <p class="subtitle">Draw your signature with mouse, stylus, or touch. Replay the animation, then save it directly to your site.</p>
  </header>

  <div class="studio-container">
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="guide-box" id="guideBox">Draw Signature Here (ViewBox 320 × 154)</div>
      <canvas id="drawCanvas" width="640" height="308"></canvas>
    </div>

    <div class="toolbar">
      <div class="btn-group">
        <button id="undoBtn" type="button">↩ Undo Stroke</button>
        <button id="clearBtn" type="button">🗑 Clear</button>
        <button id="playBtn" type="button">▶ Play Animation</button>
      </div>
      <div class="btn-group">
        <button class="primary" id="saveLocalBtn" type="button">💾 Save & Apply to Site</button>
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="preview-section">
      <div class="preview-header">Live Animation Preview</div>
      <div class="preview-box" id="previewContainer">
        <svg id="previewSvg" class="preview-svg" viewBox="0 0 320 154" fill="none"></svg>
      </div>
    </div>

    <div class="output-card">
      <header>
        <h3>Generated SVG Path Data</h3>
        <button id="copyBtn" type="button" style="padding: 4px 10px; font-size: 11px;">📋 Copy JSON</button>
      </header>
      <textarea id="outputJson" readonly placeholder="Your stroke path data will appear here..."></textarea>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    const guideBox = document.getElementById('guideBox');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const playBtn = document.getElementById('playBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveLocalBtn = document.getElementById('saveLocalBtn');
    const statusMsg = document.getElementById('statusMsg');
    const previewSvg = document.getElementById('previewSvg');
    const outputJson = document.getElementById('outputJson');

    const V_WIDTH = 320;
    const V_HEIGHT = 154;

    let strokes = []; // Array of strokes, each is array of {x, y}
    let currentStroke = null;
    let isDrawing = false;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = V_WIDTH / rect.width;
      const scaleY = V_HEIGHT / rect.height;
      return {
        x: Math.round((clientX - rect.left) * scaleX * 10) / 10,
        y: Math.round((clientY - rect.top) * scaleY * 10) / 10
      };
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scale = canvas.width / V_WIDTH;

      ctx.save();
      ctx.scale(scale, scale);
      ctx.strokeStyle = '#C0FE04';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const allStrokes = [...strokes, ...(currentStroke ? [currentStroke] : [])];

      for (const stroke of allStrokes) {
        if (!stroke || stroke.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length - 1; i++) {
          const midX = (stroke[i].x + stroke[i + 1].x) / 2;
          const midY = (stroke[i].y + stroke[i + 1].y) / 2;
          ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, midX, midY);
        }
        ctx.lineTo(stroke[stroke.length - 1].x, stroke[stroke.length - 1].y);
        ctx.stroke();
      }
      ctx.restore();

      guideBox.style.display = allStrokes.length > 0 ? 'none' : 'flex';
      updateSvgPreview();
    }

    function strokeToSvgPath(points) {
      if (!points || points.length === 0) return '';
      if (points.length === 1) return `M${points[0].x} ${points[0].y} L${points[0].x + 0.1} ${points[0].y + 0.1}`;

      let d = `M${points[0].x} ${points[0].y}`;
      if (points.length === 2) {
        d += ` L${points[1].x} ${points[1].y}`;
        return d;
      }

      for (let i = 1; i < points.length - 1; i++) {
        const p0 = points[i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const midX = Math.round(((p1.x + p2.x) / 2) * 10) / 10;
        const midY = Math.round(((p1.y + p2.y) / 2) * 10) / 10;
        d += ` Q${p1.x} ${p1.y} ${midX} ${midY}`;
      }
      d += ` L${points[points.length - 1].x} ${points[points.length - 1].y}`;
      return d;
    }

    function getFxData() {
      return strokes.map((s, idx) => ({
        order: idx,
        d: strokeToSvgPath(s),
        strokeWidth: 4
      }));
    }

    function updateSvgPreview() {
      const fxData = getFxData();
      outputJson.value = JSON.stringify(fxData, null, 2);

      previewSvg.innerHTML = '';
      let delay = 0.2;
      fxData.forEach((item, idx) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', item.d);
        path.setAttribute('stroke', '#C0FE04');
        path.setAttribute('stroke-width', item.strokeWidth);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        previewSvg.appendChild(path);

        const len = path.getTotalLength() || 100;
        const dur = Math.max(0.3, len / 600);
        path.style.setProperty('--dur', `${dur}s`);
        path.style.setProperty('--delay', `${delay}s`);
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        delay += dur + 0.05;
      });
    }

    function startDrawing(e) {
      isDrawing = true;
      wrapper.classList.add('active');
      const pt = getCoords(e);
      currentStroke = [pt];
      renderCanvas();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pt = getCoords(e);
      const last = currentStroke[currentStroke.length - 1];
      const dist = Math.hypot(pt.x - last.x, pt.y - last.y);
      if (dist >= 2) {
        currentStroke.push(pt);
        renderCanvas();
      }
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      wrapper.classList.remove('active');
      if (currentStroke && currentStroke.length > 1) {
        strokes.push(currentStroke);
      }
      currentStroke = null;
      renderCanvas();
    }

    canvas.addEventListener('mousedown', startDrawing);
    window.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    window.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    undoBtn.addEventListener('click', () => {
      strokes.pop();
      renderCanvas();
    });

    clearBtn.addEventListener('click', () => {
      strokes = [];
      currentStroke = null;
      renderCanvas();
      statusMsg.textContent = '';
    });

    playBtn.addEventListener('click', () => {
      previewSvg.classList.remove('is-playing');
      void previewSvg.offsetWidth;
      previewSvg.classList.add('is-playing');
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(outputJson.value);
      statusMsg.textContent = '✅ Copied SVG signature JSON to clipboard!';
    });

    saveLocalBtn.addEventListener('click', async () => {
      if (strokes.length === 0) {
        statusMsg.textContent = '⚠️ Please draw your signature first!';
        return;
      }
      const fxData = getFxData();
      try {
        const res = await fetch('/api/save-signature', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fxData)
        });
        if (res.ok) {
          statusMsg.textContent = '🎉 Signature applied directly to the site!';
        } else {
          statusMsg.textContent = '💡 Downloaded signature.json. You can tell me to apply it!';
          downloadJson(fxData);
        }
      } catch (err) {
        statusMsg.textContent = '💾 Saved signature.json to downloads! You can tell me to apply it.';
        downloadJson(fxData);
      }
    });

    function downloadJson(data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'signature.json';
      a.click();
    }

    renderCanvas();
  </script>
</body>
</html>
